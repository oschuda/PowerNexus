<!DOCTYPE html>
<html lang="{{ lang() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolved PowerNexus v{{ version }} - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 60px 40px;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #999;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        .error {
            color: #ef4444;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .demo-users {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            font-size: 0.85rem;
            color: #666;
        }
        .demo-users p { margin-bottom: 8px; font-weight: 600; }
        .demo-users code {
            display: block;
            background: #f5f5f5;
            padding: 4px 8px;
            margin: 4px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>🔋 Evolved PowerNexus</h1>
        <p>v{{ version }}</p>
    </div>
    
    {% if error_key %}
    <div class="error">❌ {{ t(error_key) }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label>{{ t('admin.username') }}</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label>{{ t('admin.password') }}</label>
            <input type="password" name="password" required>
        </div>
        <button class="login-btn">{{ t('login.submit') }}</button>
    </form>
    
    {% if demo_users %}
    <div class="demo-users">
        <p>📝 {{ t('login.demo') }}:</p>
        <code>admin / admin123</code>
        <code>user1 / user123</code>
        <code>guest / guest123</code>
    </div>
    {% endif %}
</div>
</body>
</html>
