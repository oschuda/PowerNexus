<!DOCTYPE html>
<html lang="{{ lang() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('account.title') }} - Evolved PowerNexus v{{ version }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .box { background: #1e293b; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 28px; width: min(420px, 100%); }
        h1 { font-size: 1.3rem; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin: 12px 0 4px; }
        input { width: 100%; padding: 9px; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: white; }
        button { margin-top: 18px; width: 100%; padding: 10px; background: #3b82f6; color: white; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #result { margin-top: 12px; color: #fca5a5; font-size: 0.9rem; min-height: 1.2em; }
        a { color: #93c5fd; font-size: 0.85rem; display: inline-block; margin-top: 12px; }
    </style>
</head>
<body>
<form class="box" id="form">
    <h1>🔑 {{ t('account.title') }}</h1>
    {% if forced %}<p>{{ t('account.forced') }}</p>{% endif %}
    <p>{{ t('account.rules') }}</p>
    <label for="current">{{ t('account.current') }}</label>
    <input id="current" type="password" autocomplete="current-password" required>
    <label for="new">{{ t('account.new') }}</label>
    <input id="new" type="password" autocomplete="new-password" required>
    <label for="repeat">{{ t('account.repeat') }}</label>
    <input id="repeat" type="password" autocomplete="new-password" required>
    <button type="submit">{{ t('common.save') }}</button>
    <div id="result"></div>
    {% if not forced %}<a href="/">← Dashboard</a>{% else %}<a href="/logout">{{ t('menu.logout') }}</a>{% endif %}
</form>
<script>
document.getElementById('form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var result = document.getElementById('result');
    var fresh = document.getElementById('new').value;
    if (fresh !== document.getElementById('repeat').value) {
        result.textContent = {{ t('account.mismatch')|tojson }};
        return;
    }
    var response = await fetch('/api/account/password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current: document.getElementById('current').value, password: fresh })
    });
    if (response.ok) { window.location.href = '/'; return; }
    var data = await response.json().catch(function () { return {}; });
    result.textContent = data.error || ('HTTP ' + response.status);
});
</script>
</body>
</html>
